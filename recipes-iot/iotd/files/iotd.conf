# Configuration du demon iotd (passerelle IoT)
# Format : cle = valeur. Les lignes commencant par # sont des commentaires.
# Pour appliquer une modification : systemctl restart iotd

# 1 = actif, 0 = le demon s'arrete aussitot
enabled = 1

# Broker MQTT. Sous QEMU en mode slirp, l'hote est joignable a 10.0.2.2
broker = 10.0.2.2
port = 1883

# Topic de l'etat ; la disponibilite est publiee sur <topic>/availability
topic = gateway/status

# Periode de publication, en secondes
interval = 10
