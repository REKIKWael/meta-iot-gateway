# Ajoute cette couche au chemin de recherche de BitBake
BBPATH .= ":${LAYERDIR}"

# Recettes et ajouts (bbappend) de la couche
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "iot-gateway"
BBFILE_PATTERN_iot-gateway = "^${LAYERDIR}/"
BBFILE_PRIORITY_iot-gateway = "10"

LAYERVERSION_iot-gateway = "1"
# core : OpenEmbedded-Core ; networking-layer : meta-networking (mosquitto)
LAYERDEPENDS_iot-gateway = "core networking-layer"
LAYERSERIES_COMPAT_iot-gateway = "wrynose"
